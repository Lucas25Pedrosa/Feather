name: Build Fully Local IPA

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-fully-local-ipa.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Build iOS IPA
        run: |
          make iphoneos

      - name: Verify Fully Local TLS bundle
        run: |
          test -f _build/Payload/Feather.app/server.crt
          test -f _build/Payload/Feather.app/server.pem
          test -f _build/Payload/Feather.app/commonName.txt
          test "$(grep -c -- '-----BEGIN CERTIFICATE-----' _build/Payload/Feather.app/server.crt)" -eq 2
          test "$(cat _build/Payload/Feather.app/commonName.txt)" = "local-feather.lucaspedrosa.shop"

      - name: Upload Feather IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Fully-Local-Test
          path: packages/Feather.ipa
          if-no-files-found: error
          retention-days: 7
