name: Fully Local Build Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fully-local-build-test.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Build iOS
        run: |
          make iphoneos

      - name: Verify TLS files
        run: |
          test -f _build/Payload/Feather.app/server.crt
          test -f _build/Payload/Feather.app/server.pem
          test -f _build/Payload/Feather.app/commonName.txt
          test "$(grep -c -- '-----BEGIN CERTIFICATE-----' _build/Payload/Feather.app/server.crt)" -eq 2
          test "$(cat _build/Payload/Feather.app/commonName.txt)" = "local-feather.lucaspedrosa.shop"
