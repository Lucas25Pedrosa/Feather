name: Publish Feather 3.4.0 Stable

on:
  push:
    branches:
      - stable/3.4.0
    paths:
      - .github/workflows/build-stable-3.4.0.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Feather 3.4.0 Stable
        uses: actions/checkout@v4
        with:
          ref: stable/3.4.0
          submodules: recursive
          fetch-depth: 0

      - name: Selecionar Xcode 26.2
        run: |
          set -euo pipefail

          XCODE_PATH=""
          for candidate in /Applications/Xcode_26.2.app /Applications/Xcode_26.2.0.app
          do
            if [ -d "$candidate" ]; then
              XCODE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_PATH" ]; then
            echo 'ERRO: Xcode 26.2 não está instalado neste runner.'
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.2"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 17C52"
          xcodebuild -version

      - name: Travar dependências
        run: |
          set -euo pipefail

          RESOLVED='Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          test -f "$RESOLVED"

          python3 <<'PY'
          from pathlib import Path
          import json

          resolved = Path("Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved")
          data = json.loads(resolved.read_text(encoding="utf-8"))
          pins = {item["identity"]: item["state"].get("version") for item in data["pins"]}
          expected = {
              "apikit": "5.4.0",
              "async-http-client": "1.25.2",
              "nuke": "12.8.0",
              "swift-nio": "2.82.1",
              "swift-system": "1.4.2",
              "vapor": "4.104.0",
              "zip": "2.1.2",
          }

          for package, version in expected.items():
              actual = pins.get(package)
              if actual != version:
                  raise SystemExit(f"ERRO: {package}: esperado {version}, encontrado {actual}.")

          print(f"Package.resolved validado com {len(data['pins'])} dependências.")
          PY

          python3 <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text(encoding="utf-8")
          flag = "-disableAutomaticPackageResolution"

          if flag not in text:
              needle = "\t\t-skipPackagePluginValidation \\\n"
              if needle not in text:
                  raise SystemExit("ERRO: ponto de inserção do bloqueio de pacotes não encontrado.")
              text = text.replace(
                  needle,
                  needle + "\t\t-disableAutomaticPackageResolution \\\n",
                  1,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Configurar identidade estável
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path("Feather.xcodeproj/project.pbxproj")
          text = project.read_text(encoding="utf-8")

          target_configs = {
              "3379C1CE2DA869A3004372DA": "Debug",
              "3379C1CF2DA869A3004372DA": "Release",
          }

          for config_id, config_name in target_configs.items():
              pattern = re.compile(
                  rf"({re.escape(config_id)} /\* {config_name} \*/ = \{{.*?buildSettings = \{{\n)(.*?)(\n\t\t\t\}};\n\t\t\tname = {config_name};)",
                  re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"ERRO: configuração {config_name} não encontrada.")

              block = match.group(2)

              block, build_count = re.subn(
                  r'(^\s*CURRENT_PROJECT_VERSION\s*=\s*)[^;]+;',
                  r'\g<1>30403;',
                  block,
                  count=1,
                  flags=re.MULTILINE,
              )
              if build_count != 1:
                  raise SystemExit(f"ERRO: CURRENT_PROJECT_VERSION não encontrado em {config_name}.")

              block, name_count = re.subn(
                  r'(^\s*INFOPLIST_KEY_CFBundleDisplayName\s*=\s*)[^;]+;',
                  r'\g<1>Feather;',
                  block,
                  count=1,
                  flags=re.MULTILINE,
              )
              if name_count != 1:
                  raise SystemExit(f"ERRO: CFBundleDisplayName não encontrado em {config_name}.")

              condition_pattern = re.compile(
                  r'(^\s*SWIFT_ACTIVE_COMPILATION_CONDITIONS\s*=\s*)(".*?"|[^;]*)(;)',
                  re.MULTILINE,
              )
              condition_match = condition_pattern.search(block)

              if condition_match:
                  raw = condition_match.group(2).strip()
                  value = raw[1:-1] if raw.startswith('"') and raw.endswith('"') else raw
                  tokens = [token for token in value.split() if token]
                  if "NIGHTLY" not in tokens:
                      tokens.append("NIGHTLY")
                  replacement = condition_match.group(1) + f'"{" ".join(tokens)}"' + condition_match.group(3)
                  block = block[:condition_match.start()] + replacement + block[condition_match.end():]
              else:
                  block += '\n\t\t\t\tSWIFT_ACTIVE_COMPILATION_CONDITIONS = "NIGHTLY";'

              text = text[:match.start(2)] + block + text[match.end(2):]

          project.write_text(text, encoding="utf-8")
          PY

          grep -q 'FEATHER_PROJECT_VERSION=3.4.0' Feather.xcconfig
          grep -q 'FEATHER_PRODUCT_BUNDLE_IDENTIFIER=com.feather.lucas' Feather.xcconfig

      - name: Compilar Feather 3.4.0 Stable
        run: |
          set -o pipefail
          make iphoneos 2>&1 | tee feather-build.log

      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Feather-3.4.0-Stable-build-log
          path: feather-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validar IPA estável
        run: |
          set -euo pipefail

          test -f packages/Feather.ipa
          unzip -t packages/Feather.ipa >/dev/null

          rm -rf /tmp/feather-340-stable
          mkdir -p /tmp/feather-340-stable
          unzip -q packages/Feather.ipa -d /tmp/feather-340-stable

          APP_PLIST=$(find /tmp/feather-340-stable/Payload -maxdepth 2 -name Info.plist -print -quit)
          test -n "$APP_PLIST"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PLIST")

          echo "Versão: $VERSION"
          echo "Build: $BUILD"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Nome: $DISPLAY_NAME"

          test "$VERSION" = "3.4.0"
          test "$BUILD" = "30403"
          test "$BUNDLE_ID" = "com.feather.lucas"
          test "$DISPLAY_NAME" = "Feather"

          test ! -f /tmp/feather-340-stable/Payload/Feather.app/server.pem
          test ! -f /tmp/feather-340-stable/Payload/Feather.app/server.crt
          test ! -f /tmp/feather-340-stable/Payload/Feather.app/commonName.txt

          cp packages/Feather.ipa Feather-3.4.0-Stable.ipa
          cp packages/Feather.ipa Feather.ipa
          shasum -a 256 Feather-3.4.0-Stable.ipa | tee Feather-3.4.0-Stable.sha256

      - name: Preparar notas da versão
        run: |
          SHA=$(shasum -a 256 Feather-3.4.0-Stable.ipa | awk '{print $1}')

          cat > RELEASE_NOTES.md <<EOF
          # Feather 3.4.0

          Versão estável promovida da linha 3.4.0 após validação das Betas 1 e 2.

          Destaques:
          - nova opção Instalação rápida em Ajustes > Instalação;
          - um único certificado importado é usado automaticamente pela Instalação rápida;
          - com dois ou mais certificados, aparece a seleção de Certificado padrão;
          - com Instalação rápida desativada, o fluxo manual permanece disponível;
          - nova área Personalizações em Ajustes;
          - personalizações predefinidas vinculadas aos aplicativos da Source;
          - suporte independente a ícone, nome, identificador e versão;
          - somente os campos configurados são alterados; os demais permanecem originais;
          - ícones personalizados ficam armazenados localmente em área persistente;
          - remoção individual de ícone personalizado por aplicativo;
          - novas opções em Ajustes > Redefinir para limpar ícones ou todas as personalizações;
          - limpeza automática pós-instalação preserva personalizações e ícones;
          - presets aplicados à Instalação rápida, Atualizações e ao fluxo manual;
          - correção para aplicar Bundle ID e demais presets já na primeira tentativa;
          - título da área reduzido para Personalizações;
          - progresso de download usa o tamanho informado pela Source como fallback quando o servidor não fornece Content-Length.

          Versão: 3.4.0
          Build: 30403
          Bundle ID: com.feather.lucas
          Build interna: NIGHTLY
          SHA-256: $SHA
          EOF

      - name: Publicar release v3.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view v3.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERRO: release v3.4.0 já existe."
            exit 1
          fi

          gh release create v3.4.0 \
            Feather.ipa \
            Feather-3.4.0-Stable.ipa \
            Feather-3.4.0-Stable.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Feather 3.4.0" \
            --notes-file RELEASE_NOTES.md

      - name: Confirmar publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v3.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,url,assets
