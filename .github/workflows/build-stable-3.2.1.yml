name: Publish Feather 3.2.1 Stable

on:
  workflow_dispatch:
  push:
    branches:
      - stable/3.2.1
    paths:
      - .github/workflows/build-stable-3.2.1.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout da base validada
        uses: actions/checkout@v4
        with:
          ref: 3f1ba36afcc14a5fc6a98171ce05d98cea2b14b7
          fetch-depth: 0

      - name: Baixar exatamente o artefato RC2 validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9691067548/zip" \
            > Feather-3.2.1-RC2.zip

          rm -rf rc2
          mkdir rc2
          unzip -q Feather-3.2.1-RC2.zip -d rc2
          test -f rc2/Feather-3.2.1-RC2.ipa

      - name: Validar identidade e hash da RC2
        run: |
          set -euo pipefail

          EXPECTED_SHA="2823db3b583597a07e91539c428bc6f5785d4d71ef24764ab0d3a66c870dbaf8"
          ACTUAL_SHA=$(shasum -a 256 rc2/Feather-3.2.1-RC2.ipa | awk '{print $1}')
          echo "SHA-256 RC2: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          unzip -t rc2/Feather-3.2.1-RC2.ipa >/dev/null
          rm -rf /tmp/feather-321-stable-validation
          mkdir -p /tmp/feather-321-stable-validation
          unzip -q rc2/Feather-3.2.1-RC2.ipa -d /tmp/feather-321-stable-validation

          APP_PLIST=$(find /tmp/feather-321-stable-validation/Payload -maxdepth 2 -name Info.plist -print -quit)
          test -n "$APP_PLIST"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PLIST")

          echo "Versão: $VERSION"
          echo "Build: $BUILD"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Nome: $DISPLAY_NAME"

          test "$VERSION" = "3.2.1"
          test "$BUILD" = "30209"
          test "$BUNDLE_ID" = "com.feather.lucas"
          test "$DISPLAY_NAME" = "Feather"

          cp rc2/Feather-3.2.1-RC2.ipa Feather-3.2.1-Stable.ipa
          shasum -a 256 Feather-3.2.1-Stable.ipa | tee Feather-3.2.1-Stable.sha256

      - name: Preparar notas da versão
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Feather 3.2.1

          Versão estável promovida diretamente da RC2 validada em dispositivo real.

          Ajustes desta versão:
          - IPA Library adicionada como source padrão do Feather;
          - catálogo de tweaks configurado para a IPA Library;
          - remoção da categoria redundante Apps monitorados;
          - Gerenciar apps instalados passa a ser a referência para detecção de atualizações;
          - ajustes de organização e tradução no menu de Ajustes;
          - opções de assinatura e certificado padrão integradas diretamente em Instalação;
          - Limpeza automática integrada diretamente em Instalação;
          - opção para limpar cache após instalação e, opcionalmente, apagar cópias Importadas e Assinadas;
          - Backup e Restauração passa a indicar explicitamente Versões e atualizações;
          - preservação do botão Limpar cache agora no menu principal de Ajustes.

          Versão: 3.2.1
          Build: 30209
          Bundle ID: com.feather.lucas
          Build interna: NIGHTLY
          SHA-256: 2823db3b583597a07e91539c428bc6f5785d4d71ef24764ab0d3a66c870dbaf8
          EOF

      - name: Publicar release v3.2.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view v3.2.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERRO: release v3.2.1 já existe."
            exit 1
          fi

          gh release create v3.2.1 \
            Feather-3.2.1-Stable.ipa \
            Feather-3.2.1-Stable.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target 3f1ba36afcc14a5fc6a98171ce05d98cea2b14b7 \
            --title "Feather 3.2.1" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Confirmar publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v3.2.1 \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,url,assets
