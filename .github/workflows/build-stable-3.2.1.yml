name: Build Feather 3.2.1 Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - stable/3.2.1

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stable/3.2.1
          submodules: recursive

      - name: Aplicar ajustes Feather 3.2.1
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_321.py
          python3 .github/scripts/fix_backup_beta.py

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Feather Feather.xcconfig
            git commit -m "[skip ci] Apply Feather 3.2.1 refinements"
            git push origin HEAD:stable/3.2.1
          fi

      - name: Validar ajustes 3.2.1
        run: |
          set -euo pipefail
          grep -q 'FEATHER_PROJECT_VERSION=3.2.1' Feather.xcconfig
          grep -q 'Label("Atualizações e instalação"' Feather/Views/Settings/SettingsView.swift
          grep -q '.navigationTitle("Atualizações e instalação")' Feather/Views/Settings/UpdateEngineSettingsView.swift
          ! grep -q 'Label("Apps monitorados"' Feather/Views/Settings/TweakCatalogView.swift
          ! grep -q 'private struct MonitoredAppsView' Feather/Views/Settings/TweakCatalogView.swift
          grep -q 'Label("Cache e armazenamento"' Feather/Views/Settings/Installation/InstallationView.swift
          ! grep -q 'Label("Cache e armazenamento"' Feather/Views/Settings/SettingsView.swift
          ! grep -q 'Label("Conteúdo protegido"' Feather/Views/Settings/StorageCleanupView.swift
          ! grep -q 'Label("Limpar cache agora"' Feather/Views/Settings/StorageCleanupView.swift
          grep -q 'Label("Limpar cache agora"' Feather/Views/Settings/SettingsView.swift
          grep -q 'Versões e atualizações' Feather/Views/Settings/Backup/BackupView.swift
          grep -q 'com.lucas.ipa.repository' Feather/FeatherApp.swift
          grep -q 'https://feather-source.f8s79jzkbk.workers.dev/' Feather/FeatherApp.swift
          grep -q 'Configure assinatura, instalação, arquivos' Feather/Views/Settings/SettingsView.swift

      - name: Selecionar Xcode 26.2 do build validado
        run: |
          set -euo pipefail
          XCODE_PATH=""
          for candidate in /Applications/Xcode_26.2.app /Applications/Xcode_26.2.0.app
          do
            if [ -d "$candidate" ]; then
              XCODE_PATH="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_PATH" ]; then
            echo 'ERRO: Xcode 26.2 não está instalado neste runner.'
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.2"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 17C52"
          xcodebuild -version

      - name: Travar dependências oficiais
        run: |
          set -euo pipefail
          RESOLVED='Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
          test -f "$RESOLVED"
          python3 <<'PY'
          from pathlib import Path
          import json

          resolved = Path("Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved")
          data = json.loads(resolved.read_text(encoding="utf-8"))
          pins = {item["identity"]: item["state"].get("version") for item in data["pins"]}
          expected = {
              "apikit": "5.4.0",
              "async-http-client": "1.25.2",
              "nuke": "12.8.0",
              "swift-nio": "2.82.1",
              "swift-system": "1.4.2",
              "vapor": "4.104.0",
              "zip": "2.1.2",
          }
          for package, version in expected.items():
              actual = pins.get(package)
              if actual != version:
                  raise SystemExit(f"ERRO: {package}: esperado {version}, encontrado {actual}.")
          print(f"Package.resolved carregado com {len(data['pins'])} dependências.")
          PY

          python3 <<'PY'
          from pathlib import Path
          path = Path("Makefile")
          text = path.read_text(encoding="utf-8")
          flag = "-disableAutomaticPackageResolution"
          if flag not in text:
              needle = "\t\t-skipPackagePluginValidation \\\n"
              if needle not in text:
                  raise SystemExit("ERRO: ponto de inserção para travar os pacotes não encontrado.")
              text = text.replace(needle, needle + "\t\t-disableAutomaticPackageResolution \\\n", 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Configurar Feather 3.2.1 Stable NIGHTLY
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          project = Path("Feather.xcodeproj/project.pbxproj")
          text = project.read_text(encoding="utf-8")
          target_configs = {
              "3379C1CE2DA869A3004372DA": "Debug",
              "3379C1CF2DA869A3004372DA": "Release",
          }
          for config_id, config_name in target_configs.items():
              pattern = re.compile(
                  rf"({re.escape(config_id)} /\* {config_name} \*/ = \{{.*?buildSettings = \{{\n)(.*?)(\n\t\t\t\}};\n\t\t\tname = {config_name};)",
                  re.DOTALL,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"ERRO: configuração {config_name} não encontrada.")
              block = match.group(2)
              block, build_count = re.subn(
                  r'(^\s*CURRENT_PROJECT_VERSION\s*=\s*)[^;]+;',
                  r'\g<1>30208;',
                  block,
                  count=1,
                  flags=re.MULTILINE,
              )
              if build_count != 1:
                  raise SystemExit(f"ERRO: build não encontrado em {config_name}.")
              block, name_count = re.subn(
                  r'(^\s*INFOPLIST_KEY_CFBundleDisplayName\s*=\s*)[^;]+;',
                  r'\g<1>Feather;',
                  block,
                  count=1,
                  flags=re.MULTILINE,
              )
              if name_count != 1:
                  raise SystemExit(f"ERRO: nome do app não encontrado em {config_name}.")
              condition_pattern = re.compile(
                  r'(^\s*SWIFT_ACTIVE_COMPILATION_CONDITIONS\s*=\s*)(".*?"|[^;]*)(;)',
                  re.MULTILINE,
              )
              condition_match = condition_pattern.search(block)
              if not condition_match:
                  raise SystemExit(f"ERRO: condições Swift não encontradas em {config_name}.")
              raw = condition_match.group(2).strip()
              value = raw[1:-1] if raw.startswith('"') and raw.endswith('"') else raw
              tokens = [token for token in value.split() if token]
              if "NIGHTLY" not in tokens:
                  tokens.append("NIGHTLY")
              replacement = condition_match.group(1) + f'"{" ".join(tokens)}"' + condition_match.group(3)
              block = block[:condition_match.start()] + replacement + block[condition_match.end():]
              text = text[:match.start(2)] + block + text[match.end(2):]
          project.write_text(text, encoding="utf-8")
          PY

          grep -q '#if !NIGHTLY && !DEBUG' Feather/Views/Settings/SettingsView.swift
          grep -q 'FEATHER_PROJECT_VERSION=3.2.1' Feather.xcconfig
          grep -q 'FEATHER_PRODUCT_BUNDLE_IDENTIFIER=com.feather.lucas' Feather.xcconfig
          grep -q 'SWIFT_ACTIVE_COMPILATION_CONDITIONS = ".*NIGHTLY' Feather.xcodeproj/project.pbxproj

      - name: Compilar Feather 3.2.1 para iPhone
        run: |
          set -o pipefail
          make iphoneos 2>&1 | tee feather-build.log

      - name: Publicar log da compilação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Feather-3.2.1-Candidate-build-log
          path: feather-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validar IPA 3.2.1 gerado
        run: |
          set -euo pipefail
          test -f packages/Feather.ipa
          unzip -t packages/Feather.ipa >/dev/null
          rm -rf /tmp/feather-stable-321-validation
          mkdir -p /tmp/feather-stable-321-validation
          unzip -q packages/Feather.ipa -d /tmp/feather-stable-321-validation
          APP_PLIST=$(find /tmp/feather-stable-321-validation/Payload -maxdepth 2 -name Info.plist -print -quit)
          test -n "$APP_PLIST"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PLIST")
          echo "Versão: $VERSION"
          echo "Build: $BUILD"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Nome: $DISPLAY_NAME"
          test "$VERSION" = "3.2.1"
          test "$BUILD" = "30208"
          test "$BUNDLE_ID" = "com.feather.lucas"
          test "$DISPLAY_NAME" = "Feather"
          cp packages/Feather.ipa Feather-3.2.1-Candidate.ipa
          shasum -a 256 Feather-3.2.1-Candidate.ipa | tee Feather-3.2.1-Candidate.sha256

      - name: Publicar artefato Feather 3.2.1 Candidate
        uses: actions/upload-artifact@v4
        with:
          name: Feather-3.2.1-Candidate
          path: |
            Feather-3.2.1-Candidate.ipa
            Feather-3.2.1-Candidate.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
